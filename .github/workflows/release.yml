name: Release (Windows installers)

# D-1: this workflow exists to PRODUCE verified, signed installers as downloadable workflow
# artefacts. It deliberately does not create tags and does not publish a release:
#
#   - it runs only on manual dispatch (no `push: tags`), so a tag can never mint an installer
#     behind the owner's back;
#   - `permissions: contents: read` — it cannot write to the repository or to a release;
#   - it fails closed: a preflight refuses to start without an Authenticode method, and the
#     packaging scripts refuse to build unsigned, and the post-package gate refuses to pass
#     anything whose signature is not `Status: Valid`.
#
# Publishing is a separate, deliberate step by the release owner
# (docs/V1.1.4_WINDOWS_BUILD_SIGNING_HANDOFF.md §8): download the verified artefacts, create a
# DRAFT release, re-verify the downloaded files, then publish.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build signed Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Fail closed before anything is installed or built: no signing method, no run.
      - name: Require Authenticode signing configuration
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_CODE_SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODE_SIGNING_SUBJECT }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: node scripts/check-signing-env.mjs

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund

      # The same gate as a pull request: typecheck, all tests, UI/IPC wiring audits, both builds,
      # secret scans and a production dependency audit.
      - name: Verify (typecheck, tests, audits, builds, secrets, audit)
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify-gate.log

      - name: Surface failure summary
        if: failure()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const tail = (f, n) => {
              try { return fs.readFileSync(f, 'utf8').split(/\r?\n/).filter(Boolean).slice(-n).join(' ~ '); }
              catch { return '(missing ' + f + ')'; }
            };
            const clean = (t) => t.replace(/%/g, '%25').replace(/\r/g, ' ');
            console.log('::error title=verify::' + clean(tail('verify-gate.log', 20)));
          "

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify-*.log
          if-no-files-found: ignore

      - name: Generate icons
        run: node scripts/make-icons.mjs

      - name: Build both applications
        run: |
          node scripts/build-app.mjs
          node scripts/build-license-generator.mjs

      # The packaging scripts re-check the configuration and refuse to run unsigned.
      - name: Package Sauda Retail Suite (signed NSIS)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_CODE_SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODE_SIGNING_SUBJECT }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: node scripts/package-app.mjs

      - name: Package Sauda License Generator (signed NSIS)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_CODE_SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODE_SIGNING_SUBJECT }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: node scripts/package-license-generator.mjs

      # Hard gate: signature Valid, ProductVersion/FileVersion, x64 PE, no key material,
      # and SHA256SUMS.txt computed from these exact files. Nothing passes this unless signed.
      - name: Verify installers (signature, version, architecture, key material, SHA-256)
        shell: bash
        run: |
          mkdir -p artifacts
          cp packages/app/release/*.exe artifacts/
          cp packages/license-generator/release/*.exe artifacts/
          node scripts/verify-installer.mjs --dir artifacts

      # D-3: the reviewed notes file is the only accepted release text, and it must have every
      # measured value filled in before anything can be handed to the publisher.
      - name: Require the reviewed release notes, fully filled
        shell: bash
        run: node scripts/check-release-notes.mjs --file docs/V1.1.4_RELEASE_NOTES.md --require-filled

      - name: Upload signed installers (no release is created)
        uses: actions/upload-artifact@v4
        with:
          name: sauda-windows-signed-installers
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            docs/V1.1.4_RELEASE_NOTES.md
          if-no-files-found: error
