name: Release (Windows installers)

# Builds the two Windows x64 installers and hands them back as verified workflow artefacts.
#
# v1.1.4 release policy: unsigned installers are accepted by the owner. Authenticode is optional
# and never a dependency of this workflow — no certificate secret is required, and being unsigned
# is not a failure.
#
# This workflow never publishes. `permissions: contents: read` means it cannot write a release,
# and there is no release step. Publishing is a separate, deliberate act by the owner:
# download the verified artefacts, create a DRAFT release, re-verify, then publish.
#
# Triggers: manual dispatch, and a `v*` tag push so a reproducible build can be produced for a
# specific commit. A tag build still cannot publish anything.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installers (unsigned accepted)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Informational only: states whether this run can sign, or is unsigned (accepted).
      - name: Report signing status
        continue-on-error: true
        run: node scripts/check-signing-env.mjs

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund

      # The same gate as a pull request: typecheck, all tests, UI/IPC wiring audits, both builds,
      # secret scans and a production dependency audit.
      - name: Verify (typecheck, tests, audits, builds, secrets, audit)
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify-gate.log

      - name: Surface failure summary
        if: failure()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const tail = (f, n) => {
              try { return fs.readFileSync(f, 'utf8').split(/\r?\n/).filter(Boolean).slice(-n).join(' ~ '); }
              catch { return '(missing ' + f + ')'; }
            };
            const clean = (t) => t.replace(/%/g, '%25').replace(/\r/g, ' ');
            console.log('::error title=verify::' + clean(tail('verify-gate.log', 20)));
          "

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify-*.log
          if-no-files-found: ignore

      - name: Generate icons
        run: node scripts/make-icons.mjs

      - name: Build both applications
        run: |
          node scripts/build-app.mjs
          node scripts/build-license-generator.mjs

      # Signing is optional: if a certificate is present the NSIS output is signed, otherwise
      # the build continues and the artefacts are reported as unsigned (accepted).
      - name: Package Sauda Retail Suite (NSIS)
        run: node scripts/package-app.mjs

      - name: Package Sauda License Generator (NSIS)
        run: node scripts/package-license-generator.mjs

      # Hard gate: both artefacts present, ProductVersion/FileVersion, x64 PE, no key material,
      # and SHA256SUMS.txt computed from these exact files. Authenticode status is reported
      # (unsigned is accepted); it is not a failure.
      - name: Verify installers (version, architecture, key material, SHA-256)
        shell: bash
        run: |
          mkdir -p artifacts
          cp packages/app/release/*.exe artifacts/
          cp packages/license-generator/release/*.exe artifacts/
          node scripts/verify-installer.mjs --dir artifacts

      # D-3: the reviewed notes file is the only accepted release text. Sections are enforced
      # here; the filled-values gate runs at publish time (scripts/check-release-notes.mjs
      # --require-filled) once the measured sizes and hashes are recorded.
      - name: Require the reviewed release notes
        shell: bash
        run: node scripts/check-release-notes.mjs --file docs/V1.1.4_RELEASE_NOTES.md

      - name: Upload installers (no release is created)
        uses: actions/upload-artifact@v4
        with:
          name: sauda-windows-installers
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            docs/V1.1.4_RELEASE_NOTES.md
          if-no-files-found: error
